 info.innerHTML="<b>"+x.d+"</b> – "+x.m+" ("+x.p+")"+bt;
 grid.innerHTML=x[q].map(function(s,k){

}

/* हिंग्लिश खोज: देवनागरी नाम को रोमन ध्वनि-कुंजी में बदलकर मिलान (bhu / bhoo → भू) */
var CM={"क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"n","च":"ch","छ":"ch","ज":"j","झ":"jh","ञ":"n","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"s","ष":"s","स":"s","ह":"h"},
VM={"ा":"a","ि":"i","ी":"i","ु":"u","ू":"u","ृ":"ri","े":"e","ै":"ai","ो":"o","ौ":"au"},
VW={"अ":"a","आ":"a","इ":"i","ई":"i","उ":"u","ऊ":"u","ऋ":"ri","ए":"e","ऐ":"ai","ओ":"o","औ":"au"};
function NK(t){return t.toLowerCase().replace(/w/g,"v").replace(/f/g,"ph").replace(/q/g,"k").replace(/x/g,"ks").replace(/z/g,"j").replace(/sh/g,"s").replace(/ee/g,"i").replace(/oo/g,"u").replace(/rri/g,"ri").replace(/jn|gn/g,"gy").replace(/(.)\1+/g,"$1")}
function DK(t){var o="",c=t.split(""),i,ch,n;for(i=0;i<c.length;i++){ch=c[i];
if(CM[ch]){o+=CM[ch];n=c[i+1];if(n=="्"){i++}else if(VM[n]){o+=VM[n];i++}else o+="a"}
else if(VW[ch])o+=VW[ch];else if(ch=="ं"||ch=="ँ")o+="n";else if(ch=="ः")o+="h";else o+=" "}
return NK(o)}
function rm(x,v){if(!/[a-z]/i.test(v))return false;var k=NK(v).replace(/\s+/g," ").trim();if(!k)return false;
x.k=x.k||DK(x.d+" "+((x.p.match(/\(([^)]*)\)/)||["",""])[1]));
var h=" "+x.k;return h.indexOf(" "+k)>-1||(/a$/.test(k)&&h.indexOf(" "+k.slice(0,-1))>-1)}
var sb=document.getElementById("dr-q"),nf=document.getElementById("dr-nf");
function go(){for(var j=0;j<DATA.length;j++){if(btns[j].style.display!="none"){show(j);return}}}
sb.oninput=function(){var v=sb.value.trim(),n=0;btns.forEach(function(b,j){var x=DATA[j],ok=!v||(x.d+" "+x.m+" "+x.p).indexOf(v)>-1||rm(x,v);b.style.display=ok?"":"none";if(ok)n++});
for(var k in gm){gm[k].style.display=[].some.call(gm[k].lastChild.children,function(b){return b.style.display!="none"})?"":"none"}nf.style.display=n?"none":"block"};
sb.onkeydown=function(e){if(e.key=="Enter")go()};document.getElementById("dr-go").onclick=go;
